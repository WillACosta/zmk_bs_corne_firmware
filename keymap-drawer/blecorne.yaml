layout: {zmk_keyboard: blecorne, layout_name: foostan_corne_6col_layout}
layers:
  base:
  - ['$$mdi:keyboard-tab$$', Q, W, E, R, T, Y, U, I, O, P, '$$mdi:backspace$$']
  - - {t: '$$mdi:keyboard-esc$$', h: ⇧}
    - A
    - {t: S, h: ⌥}
    - {t: D, h: ⌃}
    - {t: F, h: ⇧}
    - G
    - H
    - {t: J, h: ⇧}
    - {t: K, h: ⌃}
    - {t: L, h: ⌥}
    - ;
    - ''''
  - - {t: ⌃, type: ghost}
    - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - ','
    - .
    - /
    - {t: '$$mdi:keyboard-esc$$', h: ⌃}
  - - {t: ⌘, type: ghost}
    - sym
    - $$mdi:keyboard-space$$
    - $$mdi:keyboard-return$$
    - num
    - {t: ⌥, type: ghost}
  sym:
  - - {type: trans}
    - '!'
    - '@'
    - '#'
    - $
    - '%'
    - ^
    - '&'
    - '*'
    - (
    - )
    - {type: trans}
  - - $$mdi:backspace-reverse$$
    - {type: trans}
    - /
    - \
    - '['
    - ']'
    - '-'
    - '='
    - '`'
    - .
    - {type: trans}
    - {type: trans}
  - - {type: trans}
    - {type: trans}
    - '?'
    - '|'
    - '{'
    - '}'
    - _
    - +
    - '~'
    - ','
    - {type: trans}
    - {type: trans}
  - - {type: trans}
    - {type: held}
    - {type: trans}
    - {type: trans}
    - dev
    - {type: trans}
  num:
  - - {type: trans}
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    - '0'
    - {type: trans}
  - - {type: trans}
    - F2
    - F5
    - {type: trans}
    - F11
    - F12
    - $$mdi:arrow-left$$
    - $$mdi:arrow-down$$
    - $$mdi:arrow-up$$
    - $$mdi:arrow-right$$
    - {type: trans}
    - $$mdi:backspace-reverse$$
  - - {type: trans}
    - {type: trans}
    - {type: trans}
    - {type: trans}
    - {type: trans}
    - {type: trans}
    - $$mdi:home$$
    - {t: End, type: ghost}
    - {type: trans}
    - {type: trans}
    - {type: trans}
    - {type: trans}
  - - {type: trans}
    - {type: trans}
    - {type: trans}
    - {type: trans}
    - {type: held}
    - {type: trans}
  dev:
  - - {type: trans}
    - $$mdi:brightness-4$$
    - $$mdi:brightness-7$$
    - $$mdi:skip-next$$
    - $$mdi:play-pause$$
    - $$mdi:skip-next$$
    - $$mdi:mouse-move-up$$
    - $$mdi:mouse-left-click$$
    - $$mdi:mouse-scroll-wheel$$
    - $$mdi:mouse-right-click$$
    - {type: trans}
    - {type: trans}
  - - {t: '$$mdi:bluetooth-off$$', type: held}
    - {t: '$$mdi:bluetooth$$', s: '0'}
    - {t: '$$mdi:bluetooth$$', s: '1'}
    - {t: '$$mdi:bluetooth$$', s: '2'}
    - {t: '$$mdi:bluetooth$$', s: '3'}
    - {t: '$$mdi:bluetooth$$', s: '4'}
    - $$mdi:cursor-move$$
    - $$mdi:cursor-move$$
    - $$mdi:cursor-move$$
    - $$mdi:cursor-move$$
    - {type: trans}
    - '&p_email'
  - - {type: trans}
    - {type: trans}
    - {type: trans}
    - $$mdi:volume-mute$$
    - $$mdi:volume-low$$
    - VOLUME UP
    - $$mdi:gesture-swipe-left$$
    - $$mdi:gesture-swipe-down$$
    - $$mdi:gesture-swipe-up$$
    - $$mdi:gesture-swipe-right$$
    - {type: trans}
    - {type: trans}
  - - {type: trans}
    - {type: held}
    - {type: trans}
    - {type: trans}
    - {type: held}
    - {type: trans}
combos:
- p: [1, 2]
  k: $$mdi:keyboard-tab$$
  l: [base]
- p: [18, 19]
  k: $$mdi:home$$
  l: [base]
- p: [20, 21]
  k: {t: End, type: ghost}
  l: [base]
- p: [19, 20]
  k: $$mdi:backspace$$
  l: [base]
- p: [30, 31]
  k: $$mdi:chevron-double-down$$
  l: [base]
- p: [7, 6]
  k: $$mdi:chevron-double-up$$
  l: [base]
- p: [3, 2]
  k: Ctl+W
  l: [base]
- p: [14, 15]
  k: Ctl+A
  l: [base]
- p: [17, 16]
  k: $$mdi:keyboard-return$$
  l: [base]
- p: [1, 1, 2, 3]
  k: Ctl+TAB
  l: [base]
- p: [2, 3, 4]
  k: Alt+TAB
- p: [13, 17]
  k: Gui+]
- p: [25, 29]
  k: Gui+[
