---
include:
  - board: blecorne_left
    shield: nice_view
    artifact-name: bs_corne_left

  - board: blecorne_right
    shield: nice_view
    artifact-name: bs_corne_right
    cmake-args: -DCONFIG_ZMK_STATUS_ADVERTISEMENT=n

  - board: blecorne_left
    shield: settings_reset
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n
    artifact-name: reset_left

  - board: blecorne_right
    shield: settings_reset
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n
    artifact-name: reset_right

  # Use only while reproducing a dropout. USB logging increases battery use.
  - board: blecorne_left
    shield: nice_view
    snippet: zmk-usb-logging
    artifact-name: bs_corne_left_debug

  - board: blecorne_right
    shield: nice_view
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STATUS_ADVERTISEMENT=n
    artifact-name: bs_corne_right_debug
